<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social</title>

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/social.css">
</head>
    <body>
        <div id="navbar"></div>
        
        <main class="socials-container">
        <h1>Socials</h1>
        <p>Find VisualTail Studio around the web.</p>

        <section class="socials-list">

            <a class="social-item"
               href="https://www.tiktok.com/@visualtailstudios?_r=1&_t=ZP-98VM5ijiNN1"
               target="_blank"
               rel="noopener noreferrer">

                <svg class="social-icon" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M9 12a4 4 0 1 0 4 4V2c1 4 3 6 7 6"/>
                </svg>

                <div class="social-item-content">
                    <h2>TikTok</h2>
                    <p>Short-form videos and studio updates.</p>
                </div>

                <span class="social-arrow" aria-hidden="true">↗</span>
            </a>

            <a class="social-item"
               href="https://www.youtube.com/@visualtailstudios"
               target="_blank"
               rel="noopener noreferrer">

                <svg class="social-icon" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="4"/>
                    <path d="m10 9 5 3-5 3z"/>
                </svg>

                <div class="social-item-content">
                    <h2>YouTube</h2>
                    <p>Videos, projects, and demonstrations.</p>
                </div>

                <span class="social-arrow" aria-hidden="true">↗</span>
            </a>

            <a class="social-item"
               href="https://github.com/visualtailstudios"
               target="_blank"
               rel="noopener noreferrer">

                <svg class="social-icon" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
                </svg>

                <div class="social-item-content">
                    <h2>GitHub</h2>
                    <p>Open-source software and development.</p>
                </div>

                <span class="social-arrow" aria-hidden="true">↗</span>
            </a>

            <a class="social-item"
               href="https://cash.app/$visualtailstudios"
               target="_blank"
               rel="noopener noreferrer">

                <svg class="social-icon" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="5"/>
                    <path d="M16 8.5c-.8-.7-1.8-1-3-1-1.7 0-3 .8-3 2s1.3 1.8 3 2.2 3 1 3 2.3-1.3 2.2-3 2.2c-1.2 0-2.4-.4-3.2-1.2M13 6v12"/>
                </svg>

                <div class="social-item-content">
                    <h2>Cash App</h2>
                    <p>Support VisualTail Studio.</p>
                </div>

                <span class="social-arrow" aria-hidden="true">↗</span>
            </a>

        </section>

        <footer class="socials-footer">
            <p>VisualTail Studio</p>
        </footer>
        </main>
        
        <script src="../JAVASCRIPT/script.js"></script>
    </body>
</html>
